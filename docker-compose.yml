version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mentobe_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "789632145"
      MYSQL_DATABASE: "mentobe"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_mysql.sql:/docker-entrypoint-initdb.d/01_init_mysql.sql
      - ./sys20260124.sql:/docker-entrypoint-initdb.d/02_sys20260124.sql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
