<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentob AI Tarot Test</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 5px; }
        #result { white-space: pre-wrap; background: #f5f5f5; padding: 15px; border-radius: 5px; min-height: 100px; }
        .hidden { display: none; }
        .section { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        label { display: block; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Mentob AI Tarot Backend Test</h1>

    <div id="auth-section" class="section">
        <h2>Login</h2>
        <label>Email: <input type="email" id="email" value="demo@mentobai.com"></label>
        <label>Password: <input type="password" id="password" value="Demo123!"></label>
        <button onclick="login()">Login</button>
        <p id="auth-status"></p>
    </div>

    <div id="app-section" class="section hidden">
        <h2>Tarot Interpretation</h2>
        <div id="user-info"></div>
        
        <label>Question: <textarea id="question" rows="3">What is my career outlook?</textarea></label>
        
        <label>Spread:
            <select id="spread">
                <option value="single">Single Card</option>
                <option value="three">Three Card (Past, Present, Future)</option>
            </select>
        </label>

        <button onclick="interpret()">Interpret (Stream)</button>
        
        <h3>Result:</h3>
        <div id="result"></div>
    </div>

    <script>
        let currentUser = null;
        let credentials = null;

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    currentUser = data.data;
                    credentials = btoa(email + ':' + password);
                    document.getElementById('auth-status').innerText = 'Logged in as ' + currentUser.username;
                    document.getElementById('auth-status').style.color = 'green';
                    document.getElementById('app-section').classList.remove('hidden');
                    document.getElementById('auth-section').classList.add('hidden');
                } else {
                    document.getElementById('auth-status').innerText = 'Error: ' + data.error.message;
                    document.getElementById('auth-status').style.color = 'red';
                }
            } catch (e) {
                document.getElementById('auth-status').innerText = 'Network Error: ' + e.message;
            }
        }

        async function interpret() {
            if (!credentials) return alert('Please login first');
            
            const question = document.getElementById('question').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = 'Thinking...';
            
            // Mock Data
            const cards = [
                { id: 0, name: "The Fool", isReversed: false }
            ];
            
            const spread = {
                id: "single",
                name: "Single Card",
                description: "Simple answer",
                positions: [{ id: "1", name: "Main", description: "The answer" }]
            };

            try {
                const response = await fetch('/api/tarot/interpret', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + credentials
                    },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        question,
                        spread,
                        cards
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    resultDiv.innerText = 'Error: ' + (err.error?.message || response.statusText);
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                resultDiv.innerText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const text = decoder.decode(value);
                    resultDiv.innerText += text;
                }
                
            } catch (e) {
                resultDiv.innerText = 'Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
